<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perf Benchmark JS</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 16px;
            display: grid;
            place-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 16px;

            h2 {
                font-size: 12px;
                opacity: .5;
                font-weight: 500;
                margin: 0;
                padding: 0;
            }
        }

        .code {
            background: #141414;
            border-radius: 6px;
            border: 0;
            color: #d4d4d4;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            resize: none;
            width: 100%;
            field-sizing: content;
        }

        .test-cases {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .test-case {
            background: #2a2a2a;
            border-radius: 6px;
            display: flex;
            flex-direction: column;

            header {
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                padding: 8px;
                align-items: center;

                .test-id {
                    border-radius: 100%;
                    background: #141414;
                    width: 20px;
                    height: 20px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    text-align: center;
                    color: rgba(255, 255, 255, .7);
                }

                .ops {
                    opacity: .5;
                    font-size: 9px;
                }
            }

            .code {
                border-radius: 0 0 6px 6px;
            }
        }

        .send-button {
            border-radius: 6px;
            background: rgba(255, 255, 255, .3);
            border: 0;
            color: white;
            cursor: pointer;
            padding: 6px 12px;
            transition: background .3s ease;
            width: fit-content;
            &:hover {
                background: rgba(255, 255, 255, .5);
            }
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            .chart {
                width: 200px;
                height: 300px;
            }

            .bar {
                transform: scale(1, -1);
                transition: height .5s ease;
            }

            .percentages {
                opacity: .5;
                display: flex;
                font-size: 10px;
                justify-content: space-between;
                gap: 32px;
                margin-top: 16px;
            }
        }

        .chart-container2 {
            display: flex;

            .chart-item2 {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                gap: 5px;

                span.percentage-index {
                    border-radius: 50%;
                    background: rgba(0, 0, 0, 0.2);
                    color: rgba(255, 255, 255, 0.7);
                    width: 2rem;
                    height: 2rem;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
                span.percentage-value {
                    opacity: .5;
                }
            }
          
            .chart2 {
                width: 50px;
                height: 100%;
            }

            .bar {
                transform: scale(1, -1);
                transition: height .5s ease;
            }
        }
    </style>
    <script type="module">
        const $globalCode = document.querySelector('#global');
        const $sendButton = document.querySelector('.send-button');
        const $bars = document.querySelectorAll('.bar');
        //const $percentages = document.querySelectorAll('.percentage');
        const $percentagesIndex = document.querySelectorAll('.percentage-index');
        const $percentagesValue = document.querySelectorAll('.percentage-value');

        const COLORS = ['green', 'yellow', 'orange', 'red', 'purple'];

        async function runTestCases() {
            const $testCases = document.querySelectorAll('.test-case');
            const globalCode = $globalCode.value;
            
            $bars.forEach(bar => bar.setAttribute('height', 0));
            //$percentages.forEach(percentage => percentage.textContent = '');
            $percentagesIndex.forEach(percentage => percentage.textContent = '');
            $percentagesValue.forEach(percentage => percentage.textContent = '');

            /*
            $testCases.forEach(async testCase => {
                const $code = testCase.querySelector('.code');
                const $ops = testCase.querySelector('.ops');

                const codeValue = $code.value;
                $ops.textContent = 'Loading...';

                const result = await runTest({ code: codeValue, data: globalCode });
                $ops.textContent = `${result.toLocaleString()} ops/s`;
            });
            */

            const promises = Array.from($testCases).map(async (testCase, index) => {
                const $code = testCase.querySelector('.code');
                const $ops = testCase.querySelector('.ops');

                const codeValue = $code.value;
                $ops.textContent = 'Loading...';

                const result = await runTest({ code: codeValue, data: globalCode });
                $ops.textContent = `${result.toLocaleString()} ops/s`;

                return result;
            });
          
            const results = await Promise.all(promises);

            const maxOps = Math.max(...results);

            const sortedResults = results
                .map((result, index) => ({ result, index }))
                .sort((a, b) => b.result - a.result);

            results.forEach((result, index) => {
                const bar = $bars[index];
                //const percentage = $percentages[index];
                const percentageIndexItem = $percentagesIndex[index];
                const percentageValueItem = $percentagesValue[index];
                
                const indexColor = sortedResults.findIndex(x => x.index === index);
                const color = COLORS[indexColor];

                const height = result / maxOps * 300; // 300 es la altura máxima del chart
                bar.setAttribute('height', height);
                bar.setAttribute('fill', color);

                const percentageValue = Math.round(result / maxOps * 100);
                //percentage.textContent = `${percentageValue}%`;
                percentageIndexItem.textContent = `${index + 1}`;
                percentageValueItem.textContent = `${percentageValue}%`;
            });
        }

        async function runTest({ code, data}) {
            // Sin web worker, haciendo uso del hilo principal de ejecución de JavaScript
            /*
            const duration = 1000; // 1 segundo
            let result;
            try {
                result = await eval(`(async () => {
                    let PERF__ops = 0;
                    let PERF__start = Date.now();
                    let PERF__end = Date.now() + ${duration};
                    ${data};

                    while (Date.now() < PERF__end) {
                        ${code};
                        PERF__ops++;
                    }
                    return PERF__ops;
                })()`); // IIFE = Inmediately Invoked Function Expression
            } catch(error) {
                console.log(error);
                result = 0;
            }

            return result;
            */

            // Con web worker, haciendo uso de un hilo distinto al principal de ejecución de JavaScript
            const worker = new Worker('worker.js');
            worker.postMessage({ code, data, duration: 1000 });
            
            // Forma tradicional
            /*
            return new Promise(resolve => {
                worker.onmessage = event => {
                    resolve(event.data);
                };
            })
            */

            // Forma mas nueva con una nueva funcion de javascript
            const { resolve, promise } = Promise.withResolvers();
            worker.onmessage = event => { resolve(event.data); }
            return promise;
        }

        $sendButton.addEventListener('click', () => {
            runTestCases();
        })

        // run test cases on init
        runTestCases();
    </script>
</head>
<body>
    <!--
        Ejemplo que simula lo mismo que hace está página https://perf.link
    -->
    <main class="container">
        <div class="content">
            <h2>Global</h2>
            <textarea id="global" class="code" rows="1">const data = [...Array(1000).keys()]</textarea>
            <h2>Test cases</h2>
            <div class="test-cases">
                <article class="test-case">
                    <header>
                        <span class="test-id">1</span>
                        <span class="ops"></span>
                    </header>
                    <textarea class="code" rows="1">data.find(x => x == 100)</textarea>
                </article>
                <article class="test-case">
                    <header>
                        <span class="test-id">2</span>
                        <span class="ops"></span>
                    </header>
                    <textarea class="code" rows="1">data.find(x => x == 200)</textarea>
                </article>
                <article class="test-case">
                    <header>
                        <span class="test-id">3</span>
                        <span class="ops"></span>
                    </header>
                    <textarea class="code" rows="1">data.find(x => x == 300)</textarea>
                </article>
                <article class="test-case">
                    <header>
                        <span class="test-id">4</span>
                        <span class="ops"></span>
                    </header>
                    <textarea class="code" rows="1">data.find(x => x == 400)</textarea>
                </article>
            </div>
            <button class="send-button">Benchmark code!</button>
        </div>
       
        <!--
        <div class="chart-container">
            <svg class="chart" viewBox="0 0 200 300">
                <rect class="bar" x="0" y="-300" width="2" height="300" fill="green"></rect>
                <rect class="bar" x="0" y="-300" width="2" height="50" fill="yellow"></rect>
                <rect class="bar" x="0" y="-300" width="2" height="80" fill="orange"></rect>
                <rect class="bar" x="0" y="-300" width="2" height="100" fill="red"></rect>
            </svg>
            <div class="percentages">
                <span class="percentage">100%</span>
                <span class="percentage">40%</span>
                <span class="percentage">60%</span>
                <span class="percentage">80%</span>
            </div>
        </div>
        -->
       
        <div class="chart-container2">
            <div class="chart-item2">
                <svg class="chart2">
                    <rect class="bar" x="50%" y="-100%" width="1" height="100%" fill="green"></rect>
                </svg>
                <span class="percentage-index">1</span>
                <span class="percentage-value">100%</span>
            </div>
            <div class="chart-item2">
                <svg class="chart2">
                    <rect class="bar" x="50%" y="-100%" width="1" height="100%" fill="yellow"></rect>
                </svg>
                <span class="percentage-index">2</span>
                <span class="percentage-value">80%</span>
            </div>
            <div class="chart-item2">
                <svg class="chart2">
                    <rect class="bar" x="50%" y="-100%" width="1" height="100%" fill="orange"></rect>
                </svg>
                <span class="percentage-index">3</span>
                <span class="percentage-value">60%</span>
            </div>
            <div class="chart-item2">
                <svg class="chart2">
                    <rect class="bar" x="50%" y="-100%" width="1" height="100%" fill="red"></rect>
                </svg>
                <span class="percentage-index">4</span>
                <span class="percentage-value">40%</span>
            </div>
        </div>
    </main>
</body>
</html>
